files|0|1|Browse your folders and drives, copy, move, rename and delete files, with a list and a grid view.\nThe places pane takes you home, to the desktop, your documents, downloads and pictures; every app folder shows its own icon.|Klasörlerinize ve sürücülerinize göz atın; dosyaları kopyalayın, taşıyın, yeniden adlandırın ve silin. Liste ve ızgara görünümü.\nYerler bölmesi sizi eve, masaüstüne, belgelere, indirilenlere ve resimlere götürür; her uygulama klasörü kendi simgesiyle görünür.
hwmgr|0|1|Your devices, their drivers and their state.|Aygıtlarınız, sürücüleri ve durumları.
media|0|1|Music with playlists, videos and pictures.|Çalma listeleriyle müzik, videolar ve resimler.
notes|0|1|Write and edit text files in tabs: find and replace, line numbers, word wrap, Windows line endings kept.|Metin dosyalarını sekmelerde yazın ve düzenleyin: bul ve değiştir, satır numaraları, satır kaydırma; Windows satır sonları korunur.
pkgmgr|0|1|Find, install, update and remove packages; manage repositories; look through Alpine and Debian package lists.|Paketleri bulun, kurun, güncelleyin ve kaldırın; depoları yönetin; Alpine ve Debian paket listelerine göz atın.
settings|0|1|Everything about your computer in one place: appearance, wallpapers, display, sound, network, mouse, users, updates and more.|Bilgisayarınızla ilgili her şey tek yerde: görünüm, duvar kağıtları, ekran, ses, ağ, fare, kullanıcılar, güncellemeler ve daha fazlası.
store|0|1|The WolfOS Store: apps for WolfOS, and the system's own updates, signed and checked before they are installed.|WolfOS Mağaza: WolfOS uygulamaları ve sistemin kendi güncellemeleri; kurulmadan önce imzaları ve özetleri denetlenir.
studio|0|1|Wolf Studio: build WolfOS desktop apps. Templates, a project explorer, a coloured editor with completion, an elements and events panel, building and debugging.|Wolf Studio: WolfOS masaüstü uygulamaları geliştirin. Şablonlar, proje gezgini, kod tamamlamalı renkli düzenleyici, elemanlar ve olaylar paneli, derleme ve hata ayıklama.
taskmgr|0|1|Programs, performance graphs and services; end a program that hangs.|Programlar, performans grafikleri ve servisler; takılan bir programı sonlandırın.
terminal|0|1|The WolfOS command line: the wsh shell with history, Tab completion, pipes and redirection, and a frosted-glass window.|WolfOS komut satırı: geçmişi, Tab ile tamamlaması, boruları ve yönlendirmesi olan wsh kabuğu, buzlu cam bir pencerede.
widgets|0|1|A tour of every control of the WolfOS SDK.|WolfOS SDK'sının bütün denetimlerinin bir turu.
wolfclock|0|1|A desk clock with the date, following the desktop theme: light or dark, with your accent colour.|Masaüstü temasını izleyen, tarihli bir masa saati: açık ya da koyu, vurgu renginizle.
