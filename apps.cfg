# WolfOS Store apps: name|stars|verified|description|description_tr
browser|0|1|WolfBrowser: tabs, a secure address bar, downloads and history, on WolfWebKit with JavaScript, CSS grid and flexbox, web fonts and frames.|WolfBrowser: sekmeler, güvenli adres çubuğu, indirmeler ve geçmiş; JavaScript, CSS grid ve flexbox, web yazı tipleri ve çerçeveler destekleyen WolfWebKit üzerinde.
calc|0|1|A calculator that also works from the keyboard.|Klavyeyle de çalışan bir hesap makinesi.
clock|0|1|Alarms, world clocks, timers and a stopwatch.|Alarmlar, dünya saatleri, zamanlayıcılar ve kronometre.
